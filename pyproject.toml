[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "woundquant"
version = "0.1.0"
description = "Overlap-aware wound tissue segmentation and ruler-calibrated area measurement"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT AND CC-BY-NC-4.0"
dependencies = [
  "numpy>=1.26,<2", "pillow>=11,<12", "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23", "segmentation-models-pytorch==0.5.0",
  "timm>=1.0.17,<1.1", "gradio>=5.49,<7", "onnxruntime>=1.20,<2",
  "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
exp = ["pycocotools>=2.0.8", "scipy>=1.13,<2", "pandas>=2.2,<3",
       "statsmodels>=0.14,<0.15", "tqdm>=4.66",
       "opencv-python-headless>=4.10,<4.12", "openpyxl>=3.1"]

[project.scripts]
woundquant = "woundquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/woundquant"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_LICENSES" = "woundquant/THIRD_PARTY_LICENSES"
"LICENSE" = "woundquant/LICENSE"

[tool.hatch.build.targets.sdist]
include = ["src", "exp", "dataset", "README.md", "LICENSE", "pyproject.toml", "pixi.toml", "THIRD_PARTY_LICENSES", ".gitignore"]
exclude = ["**/*.pt", "**/*.pth", "**/*.onnx", "**/*.ckpt", "**/*.npz", "**/*.npy", "**/__pycache__", "results", "dataset/exclusive/images", "dataset/icc/samples"]
